name: release

# A v* tag is the release act. Tags with a hyphenated qualifier (v0.1.0-rc.1)
# publish a prerelease. The build lives in .goreleaser.yaml, and ci.yml's
# release-build job runs it as a snapshot on every change.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Publishes only a commit whose push to main finished green. It queries
  # rather than re-runs. The tag reaches the shell through the environment
  # and is checked before use, since git accepts tag names that would escape
  # any quoting.
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green ci run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=completed" \
            --jq '.workflow_runs[0].conclusion // "absent"')
          if [ "$conclusion" != "success" ]; then
            echo "ci for $sha concluded: $conclusion (need: success)." >&2
            echo "Tag a commit whose push to main finished green; 'absent' means no completed run exists yet." >&2
            exit 1
          fi
          echo "ci for $sha concluded success"

  libopenmpt:
    needs: validate
    uses: ./.github/workflows/libopenmpt.yml

  publish:
    needs: libopenmpt
    runs-on: ubuntu-latest
    permissions:
      contents: write      # release creation and asset upload
      id-token: write      # provenance attestation and keyless signing
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser reads the tag and the previous one from the history.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Download libopenmpt for every target
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: libopenmpt_*
          path: libopenmpt
      - name: Install goreleaser, syft and cosign
        run: |
          .github/release-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build, sign and upload the draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A stable tag can share its commit with the last prerelease; goreleaser would otherwise pick either.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        run: goreleaser release --clean
      # Verify with:
      #   gh attestation verify openlemm_<tag>_<os>_<arch>.tar.gz -R benemon/openlemm
      - name: Attest the archives' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/openlemm_*.tar.gz
            dist/openlemm_*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          gh release edit "$RELEASE_TAG" --draft=false

  # Checks the published release as a player receives it, from the release alone: the assets against
  # .github/release-contents.txt, the checksums' signature, the checksums, and each archive's provenance.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install cosign
        run: |
          .github/release-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Download the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._-]*) echo "refusing tag: $RELEASE_TAG"; exit 1;; esac
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/assets"
      # Each archive in .github/release-contents.txt, its SBOM, and the signed checksums, and nothing else.
      - name: Compare the assets with the expected list
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export LC_ALL=C
          grep -v '^ ' .github/release-contents.txt | sed "s/_VERSION_/_${RELEASE_TAG}_/" |
            while read -r archive; do printf '%s\n%s.sbom.json\n' "$archive" "$archive"; done |
            { cat; printf 'checksums.txt\nchecksums.txt.sigstore.json\n'; } | sort > "$RUNNER_TEMP/assets-expected.txt"
          find "$RUNNER_TEMP/assets" -type f -printf '%f\n' | sort > "$RUNNER_TEMP/assets-actual.txt"
          diff -u "$RUNNER_TEMP/assets-expected.txt" "$RUNNER_TEMP/assets-actual.txt"
          .github/release-contents.sh "$RUNNER_TEMP/assets" | diff -u .github/release-contents.txt -
      # The identity SECURITY.md gives players.
      - name: Verify the checksums' signature and the checksums
        working-directory: ${{ runner.temp }}/assets
        run: |
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/benemon/openlemm/\.github/workflows/release\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --strict -c checksums.txt
      - name: Verify each archive's provenance
        working-directory: ${{ runner.temp }}/assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: for archive in openlemm_*.tar.gz openlemm_*.zip; do gh attestation verify "$archive" -R benemon/openlemm; done
