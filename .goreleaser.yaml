# The release build: .github/workflows/release.yml runs it on a v* tag, once the tagged commit's ci run on main passed,
# and ci.yml's release-build job checks it and runs it as a snapshot on every change. Both first build libopenmpt on
# each target's runner (.github/libopenmpt.sh) into libopenmpt/libopenmpt_<os>_<arch>/, which each archive carries
# beside the binary. The build passes no -X flags; Go stamps the version and revision from the checkout.
version: 2

project_name: openlemm

builds:
  - id: openlemm
    main: ./cmd/openlemm
    binary: openlemm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # An empty entry keeps goreleaser's default ldflags (-s -w and -X main.*) off, so the binary links as go build
    # does.
    ldflags:
      - ""
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: openlemm
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - src: "libopenmpt/libopenmpt_{{ .Os }}_{{ .Arch }}/*"
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    # The binary in an archive names its Go modules but not their licences, which the remote search reads from the
    # module proxy. Setting env replaces goreleaser's default for archives, the file metadata cataloger, so it is kept.
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
      - SYFT_GOLANG_SEARCH_REMOTE_LICENSES=true

# Keyless, through release.yml's OIDC token; ci.yml's snapshot build skips it. SECURITY.md gives the verification.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, --yes, "--bundle=${signature}", "${artifact}"]

changelog:
  use: github-native

release:
  github:
    owner: benemon
    name: openlemm
  name_template: "{{ .Tag }}"
  # A hyphenated qualifier (v0.1.0-rc.1) publishes a prerelease.
  prerelease: auto
  # release.yml attests the archives, then publishes the draft. A draft left by a failed run is replaced.
  draft: true
  replace_existing_draft: true
  mode: keep-existing
  replace_existing_artifacts: true

# Formula/openlemm.rb in benemon/homebrew-tap, for brew install benemon/tap/openlemm. goreleaser writes it to
# dist/homebrew/Formula/openlemm.rb and pushes nothing: the formula's URLs only resolve once the draft release is
# published, and goreleaser OSS cannot push it after that, so release.yml pushes it after publishing, for stable
# releases only. It installs the program alone; Homebrew's libopenmpt is found at its prefix. The Linux program does
# not look in Homebrew's Linux prefix, so the formula is macOS only, though goreleaser writes Linux URLs into it.
# brews is deprecated in favour of homebrew_casks, which goreleaser check reports; ci.yml's release-build job accepts
# that one deprecation.
brews:
  - name: openlemm
    description: Engine that plays the Acorn Archimedes release of Lemmings™ from your own disc
    homepage: https://github.com/benemon/openlemm
    license: GPL-3.0-or-later
    directory: Formula
    repository:
      owner: benemon
      name: homebrew-tap
      branch: main
    skip_upload: "true"
    dependencies:
      - name: libopenmpt
    custom_block: |
      depends_on :macos
    install: |
      bin.install "openlemm"
    test: |
      assert_match "version=v#{version}", shell_output("#{bin}/openlemm -version")
